<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expense Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F2E20">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell">

  <!-- Top bar -->
  <header class="app-header">
    <div class="hello-row">
      <button class="hdr-av" id="hdr-avatar" onclick="openProfilePicker()" aria-label="Profile picture"></button>
      <div class="hello">
        <div class="hello-small" id="hello-small">Welcome back,</div>
        <div class="hello-name" id="hello-name">…</div>
      </div>
    </div>
    <button id="theme-toggle" class="icon-btn" onclick="toggleTheme()" aria-label="Switch light or dark theme">🌙</button>
  </header>

  <!-- Month selector (tap the name to jump to any month or year) -->
  <div class="month-bar" id="month-bar">
    <button class="month-arrow" onclick="changeMonth(-1)" aria-label="Previous month">‹</button>
    <div id="month-label" class="month-label">OCTOBER</div>
    <button class="month-arrow" onclick="changeMonth(1)" aria-label="Next month">›</button>
  </div>

  <main>

    <!-- ============ HOME ============ -->
    <section id="view-home" class="view active">

      <div class="hero">
        <div class="hero-label">SPENT THIS MONTH</div>
        <div class="hero-amount"><span class="cur">₹</span><span id="month-total">0.00</span></div>
        <div class="hero-sub">
          <span id="budget-display" class="budget-link" onclick="editBudget()">set a budget</span>
        </div>
        <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
      </div>

      <div class="quick-actions" id="quick-actions"></div>

      <div class="section-head">
        <h2>Recent</h2>
        <button class="link-btn" id="view-all-btn" onclick="showView('expenses')">See all</button>
      </div>
      <div id="expense-list-new"></div>

    </section>

    <!-- ============ ALL EXPENSES ============ -->
    <section id="view-expenses" class="view">

      <div class="section-head first">
        <h2>All Expenses</h2>
        <button class="icon-btn" onclick="openExportMenu()" aria-label="Export" title="Export">
          <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M5 21h14"/></svg>
        </button>
      </div>

      <div class="hero mini">
        <div class="hero-label" id="exp-label">TOTAL SPENT</div>
        <div class="hero-amount"><span class="cur">₹</span><span id="exp-total">0.00</span></div>
        <div class="hero-sub" id="exp-count">0 transactions</div>
      </div>

      <div class="search-row">
        <div class="search-box">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="search" id="exp-search" placeholder="Search note, category, amount or date" autocomplete="off" enterkeyhint="search">
          <button class="search-clear" id="exp-search-clear" hidden aria-label="Clear search">✕</button>
        </div>
        <button class="link-btn" id="select-toggle">Select</button>
      </div>

      <div class="chips" id="filter-chips"></div>
      <div id="all-expenses-list"></div>

    </section>

    <!-- ============ ANALYTICS ============ -->
    <section id="view-analytics" class="view">

      <div class="section-head first"><h2>Analytics</h2></div>

      <div class="card">
        <div class="card-title">DAILY OUTLAY</div>
        <div class="chart-box-small">
          <canvas id="barChart"></canvas>
        </div>
        <div id="outlay-caption" class="muted small" style="margin-top:10px;"></div>
      </div>

      <div class="card">
        <div class="card-title">BY CATEGORY</div>
        <div class="category-flex">
          <div class="ring-wrap">
            <canvas id="pieChart"></canvas>
            <div class="ring-center" id="ring-center">₹0</div>
          </div>
          <div id="category-list" class="category-list"></div>
        </div>
      </div>

    </section>

    <!-- ============ SETTINGS ============ -->
    <section id="view-settings" class="view">

      <div class="section-head first"><h2>Settings</h2></div>

      <div class="settings-list">
        <button class="set-row" onclick="openProfilePicker()">
          <span class="set-ico" id="avatar-ico">🖼️</span>
          <span class="set-text"><b>Profile picture</b><small id="avatar-state">Choose an avatar or upload a photo</small></span>
          <span class="chev">›</span>
        </button>
        <button class="set-row" onclick="openNameEditor()">
          <span class="set-ico">🙂</span>
          <span class="set-text"><b>Your name</b><small id="name-state">Not set</small></span>
          <span class="chev">›</span>
        </button>
        <button class="set-row" onclick="openThemePicker()">
          <span class="set-ico">🎨</span>
          <span class="set-text"><b>Theme color</b><small id="color-state">Forest</small></span>
          <span class="chev">›</span>
        </button>
        <button class="set-row" onclick="toggleTheme()">
          <span class="set-ico">🌙</span>
          <span class="set-text"><b>Dark mode</b><small id="theme-state">Off</small></span>
          <span class="chev">›</span>
        </button>
        <button class="set-row" onclick="editBudget()">
          <span class="set-ico">💰</span>
          <span class="set-text"><b>Monthly budget</b><small id="settings-budget-val">Not set</small></span>
          <span class="chev">›</span>
        </button>
        <button class="set-row" onclick="openCategoryBudgets()">
          <span class="set-ico">🎯</span>
          <span class="set-text"><b>Category budgets</b><small>Set a limit for each category</small></span>
          <span class="chev">›</span>
        </button>
        <button class="set-row" onclick="openInsights()">
          <span class="set-ico">💡</span>
          <span class="set-text"><b>Insights</b><small>Worth it vs regret</small></span>
          <span class="chev">›</span>
        </button>
        <button class="set-row" onclick="openSplits()">
          <span class="set-ico">🤝</span>
          <span class="set-text"><b>Splits</b><small>Share costs with friends</small></span>
          <span class="chev">›</span>
        </button>
        <button class="set-row" onclick="openExportMenu()">
          <span class="set-ico">⬇️</span>
          <span class="set-text"><b>Export data</b><small>CSV or PDF</small></span>
          <span class="chev">›</span>
        </button>
        <button class="set-row danger" onclick="openDeleteAll()">
          <span class="set-ico">🗑️</span>
          <span class="set-text"><b>Delete all expenses</b><small>Removes every expense you have recorded</small></span>
          <span class="chev">›</span>
        </button>
        <button class="set-row danger" onclick="logout()">
          <span class="set-ico">🚪</span>
          <span class="set-text"><b>Log out</b></span>
        </button>
      </div>

      <div class="foot muted small">Expense Tracker by Dame</div>

    </section>

  </main>
</div>

<!-- Select-mode bar (replaces the bottom navigation while choosing expenses to delete) -->
<div class="select-bar" id="select-bar" hidden>
  <span class="sel-count" id="sel-count">Tap expenses to select</span>
  <button class="ui-btn" id="sel-all">Select all</button>
  <button class="ui-btn danger" id="sel-del" disabled>Delete</button>
  <button class="ui-btn" id="sel-cancel">Cancel</button>
</div>

<!-- Bottom navigation -->
<nav class="bottom-nav">
  <button class="nav-item active" data-view="home" onclick="showView('home')">
    <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
    <span>Home</span>
  </button>
  <button class="nav-item" data-view="expenses" onclick="showView('expenses')">
    <svg viewBox="0 0 24 24"><line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>
    <span>Expenses</span>
  </button>
  <div class="nav-fab">
    <button class="fab" onclick="openAddSheet()" aria-label="Add expense">+</button>
  </div>
  <button class="nav-item" data-view="analytics" onclick="showView('analytics')">
    <svg viewBox="0 0 24 24"><line x1="6" y1="20" x2="6" y2="12"/><line x1="12" y1="20" x2="12" y2="5"/><line x1="18" y1="20" x2="18" y2="9"/></svg>
    <span>Analytics</span>
  </button>
  <button class="nav-item" data-view="settings" onclick="showView('settings')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    <span>Settings</span>
  </button>
</nav>

<!-- Add expense (opens from the + button) -->
<div class="sheet" id="add-sheet">
  <div class="sheet-panel">
    <div class="sheet-head">
      <h2>Add expense</h2>
      <button class="icon-btn" onclick="closeAddSheet()" aria-label="Close">✕</button>
    </div>

    <div class="scan-row">
      <input type="file" id="receiptInput" accept="image/*" capture="environment" hidden>
      <button type="button" class="scan-btn" id="scanBtn">📷 Scan receipt</button>
      <span id="scanStatus" class="muted small"></span>
    </div>

    <div class="add-form">
      <input type="number" id="amount" placeholder="₹ 0.00" step="0.01" inputmode="decimal">
      <select id="category">
        <option>Food</option>
        <option>Travel</option>
        <option>Bills</option>
        <option>Entertainment</option>
        <option>Shopping</option>
        <option>Health</option>
        <option>Other</option>
      </select>
      <input type="text" id="description" placeholder="Note (optional)" class="note-input">
      <input type="date" id="date">
      <button class="add-btn" onclick="addExpense()">Add expense</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="app.js"></script>
<script src="profile.js"></script>
<script src="splits.js"></script>
</body>
</html>
