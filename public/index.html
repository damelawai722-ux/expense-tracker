<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expense Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8B0000">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="dot"></span> Expense Tracker By Dame</div>
  <div class="topbar-right">
    <button id="theme-toggle" onclick="toggleTheme()">🌙</button>
    <button class="logout-btn" onclick="logout()">Log Out</button>
  </div>
</div>

<div class="month-bar">
  <button class="month-arrow" onclick="changeMonth(-1)">‹</button>
  <div id="month-label" class="month-label">OCTOBER</div>
  <button class="month-arrow" onclick="changeMonth(1)">›</button>
</div>

<div class="container">

  <div class="card stat-card">
    <div class="stat-label">SPENT THIS MONTH</div>
    <div class="stat-value">₹<span id="month-total">0.00</span></div>
    <div class="stat-sub">
      <span id="pct-change" class="pill"></span>
      <span class="muted">of</span>
      <span id="budget-display" class="budget-link" onclick="editBudget()">set a budget</span>
    </div>
    <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
  </div>

  <div class="card add-card">
    <div class="card-title">ADD EXPENSE</div>
    <div class="add-form">
      <input type="number" id="amount" placeholder="₹ 0.00" step="0.01" inputmode="decimal">
      <select id="category">
        <option>Food</option>
        <option>Travel</option>
        <option>Bills</option>
        <option>Entertainment</option>
        <option>Shopping</option>
        <option>Health</option>
        <option>Other</option>
      </select>
      <input type="text" id="description" placeholder="Note (optional)" class="note-input">
      <input type="date" id="date">
      <button class="add-btn" onclick="addExpense()">Add</button>
    </div>
  </div>

  <div class="card span-2">
    <div class="card-title">DAILY OUTLAY</div>
    <div class="chart-box-small">
      <canvas id="barChart"></canvas>
    </div>
    <div id="outlay-caption" class="muted small" style="margin-top:10px;"></div>
  </div>

  <div class="card">
    <div class="card-title">BY CATEGORY</div>
    <div class="category-flex">
      <div class="ring-wrap">
        <canvas id="pieChart"></canvas>
        <div class="ring-center" id="ring-center">₹0</div>
      </div>
      <div id="category-list" class="category-list"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title-row">
      <div class="card-title">RECENT</div>
      <div class="muted small">tap to delete</div>
    </div>
    <div id="expense-list-new"></div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
